<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090a10">
<title>FreqHeal</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FreqHeal">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#090a10; --bg2:#10121b; --card:#141724; --card2:#1a1e2e; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.16);
  --ink:#f3f4f8; --muted:#9aa0b6; --dim:#6b7189; --accent:#8b7bff; --accent2:#4fd1c5; --warn:#ffb37a; --r:20px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;color:var(--ink);font:15px/1.55 Outfit,system-ui,-apple-system,"Segoe UI",sans-serif;
  background:radial-gradient(1100px 600px at 0% -10%,rgba(139,123,255,.20),transparent 60%),
             radial-gradient(900px 500px at 100% 0%,rgba(79,209,197,.13),transparent 60%),var(--bg);background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink);background:rgba(255,255,255,.05);border:1px solid var(--line2);border-radius:12px;padding:9px 12px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
select option{background:var(--bg2)}
textarea{min-height:80px;resize:vertical}
h1,h2,h3{margin:0;letter-spacing:-.01em}
.hidden{display:none!important}
.muted{color:var(--muted)} .small{font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.glass{background:rgba(20,22,34,.55);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);border:1px solid var(--line2)}

/* Header */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:18px;padding:max(14px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) 14px max(20px,env(safe-area-inset-left));
  background:rgba(9,10,16,.72);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:-.02em}
.logo-orb{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0,#c4b8ff 18%,#8b7bff 45%,#2b1f7a 100%);
  box-shadow:0 0 18px rgba(139,123,255,.7);animation:breathe 6s ease-in-out infinite}
.brand .word{background:linear-gradient(90deg,#fff,#c9c2ff 60%,#7fe7dc);-webkit-background-clip:text;background-clip:text;color:transparent}
@keyframes breathe{50%{transform:scale(1.12);box-shadow:0 0 28px rgba(139,123,255,.9)}}
nav{display:flex;gap:4px;margin-left:auto}
nav button{display:flex;align-items:center;gap:7px;border:0;background:none;color:var(--muted);padding:8px 14px;border-radius:999px;font-weight:500}
nav button span{font-size:15px;opacity:.85}
nav button:hover{color:var(--ink)}
nav button.active{background:rgba(139,123,255,.16);color:#fff}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line2);background:rgba(255,255,255,.04);display:grid;place-items:center;font-size:17px;flex:none}
.icon-btn:hover{background:rgba(255,255,255,.1)}
.icon-btn.lg{width:52px;height:52px;font-size:19px}

main{max-width:1180px;margin:0 auto;padding:26px 20px 140px}
section{display:none;animation:fadeUp .35s ease}
section.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* Buttons */
.btn{border:1px solid var(--line2);background:rgba(255,255,255,.05);padding:9px 16px;border-radius:999px;font-weight:500;display:inline-flex;align-items:center;gap:8px}
.btn:hover{background:rgba(255,255,255,.1)}
.btn.primary{background:linear-gradient(135deg,#9d8cff,#6d5cf5);border-color:transparent;color:#fff;font-weight:600;box-shadow:0 8px 24px -8px rgba(125,105,255,.7)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--warn)}
.btn.sm{padding:6px 12px;font-size:13px}
.link{background:none;border:0;padding:0;color:var(--muted);font-size:13px;text-decoration:underline;text-underline-offset:3px}
.link:hover{color:var(--ink)}

/* Hero */
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;margin-bottom:26px}
@media (max-width:820px){.hero{grid-template-columns:1fr}}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:600}
.hero h1{font-size:clamp(34px,5vw,54px);line-height:1.05;font-weight:700;margin:8px 0 10px}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,#b7abff,#6ee7da);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--muted);margin:0 0 18px;max-width:460px}
.stat-row{display:flex;gap:8px;flex-wrap:wrap}
.stat{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-size:14px}
.stat b{font-weight:700}
.hero-rec{position:relative;overflow:hidden;text-align:left;border:0;border-radius:26px;padding:24px;min-height:210px;color:#fff;
  background:radial-gradient(circle at 85% 15%,rgba(255,255,255,.35),transparent 45%),linear-gradient(140deg,var(--g0),var(--g1));
  display:flex;flex-direction:column;justify-content:flex-end;gap:4px;box-shadow:0 30px 60px -30px var(--g0);transition:transform .25s}
.hero-rec:hover{transform:translateY(-3px)}
.hero-rec .eyebrow{color:rgba(255,255,255,.8)}
.hero-rec b{font-size:28px;line-height:1.1}
.hero-rec .big-icon{position:absolute;right:18px;top:10px;font-size:84px;opacity:.9;filter:drop-shadow(0 10px 20px rgba(0,0,0,.3))}
.hero-rec .go{position:absolute;right:20px;bottom:20px;width:56px;height:56px;border-radius:50%;background:#fff;color:#111;display:grid;place-items:center;box-shadow:0 10px 30px rgba(0,0,0,.35)}

/* Banner */
.banner{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:16px;margin-bottom:20px;background:linear-gradient(90deg,rgba(139,123,255,.22),rgba(79,209,197,.12));border:1px solid var(--line2)}

/* Moods */
.moods{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 14px;margin:0 -2px 10px;scroll-snap-type:x mandatory;scrollbar-width:none}
.moods::-webkit-scrollbar{display:none}
.mood{flex:0 0 150px;scroll-snap-align:start;height:150px;border-radius:22px;border:2px solid transparent;padding:14px;text-align:left;position:relative;overflow:hidden;color:#fff;
  background:radial-gradient(circle at 80% 10%,rgba(255,255,255,.3),transparent 50%),linear-gradient(150deg,var(--g0),var(--g1));display:flex;flex-direction:column;justify-content:flex-end;transition:transform .2s,border-color .2s}
.mood:hover{transform:translateY(-3px)}
.mood.on{border-color:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.12)}
.mood .mi{position:absolute;top:12px;left:14px;font-size:34px}
.mood b{font-size:17px}
.mood small{opacity:.8;font-size:12px;line-height:1.3}
.mood.all{background:linear-gradient(150deg,#2a2f45,#151826)}

.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:6px 0 16px}
.toolbar h2{font-size:24px;margin-right:auto}
.toolbar input{width:220px;border-radius:999px}
.sub{font-size:15px;color:var(--muted);font-weight:600;margin:6px 0 12px;text-transform:uppercase;letter-spacing:.1em}

/* Program cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.pcard{border-radius:var(--r);background:var(--card);border:1px solid var(--line);overflow:hidden;cursor:pointer;transition:transform .25s,border-color .25s,box-shadow .25s;display:flex;flex-direction:column}
.pcard:hover{transform:translateY(-4px);border-color:var(--line2);box-shadow:0 24px 40px -24px var(--g0)}
.pcard.playing{border-color:var(--g0);box-shadow:0 0 0 1px var(--g0),0 24px 40px -24px var(--g0)}
.pcard-art{position:relative;height:112px;background:radial-gradient(circle at 85% 0%,rgba(255,255,255,.35),transparent 50%),linear-gradient(140deg,var(--g0),var(--g1))}
.pcard-icon{position:absolute;left:14px;top:12px;font-size:30px}
.spark{position:absolute;left:0;right:0;bottom:0;width:100%;height:46px;fill:rgba(255,255,255,.32)}
.fav{position:absolute;right:10px;top:10px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(0,0,0,.25);color:#fff;font-size:16px;display:grid;place-items:center;backdrop-filter:blur(6px)}
.fav.on{color:#ff7aa8}
.eq{position:absolute;right:52px;top:18px;display:flex;gap:3px;align-items:flex-end;height:18px}
.eq i{width:4px;background:#fff;border-radius:2px;animation:eq 1s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}
@keyframes eq{0%,100%{height:5px}50%{height:18px}}
.pcard-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.pcard-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.pcard h3{font-size:18px}
.pcard p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.45;flex:1}
.freqs{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.freqs span{font-size:11.5px;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.06);color:#d5d8e6;font-variant-numeric:tabular-nums}
.pcard-actions{display:flex;gap:14px;margin-top:6px}
.empty{padding:40px;text-align:center;color:var(--muted);border:1px dashed var(--line2);border-radius:var(--r)}

/* Panels */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.page-head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.page-head h1{font-size:34px;font-weight:700;margin-right:auto}
.page-head p{width:100%;margin:4px 0 0;color:var(--muted)}

/* Studio */
.studio{display:grid;grid-template-columns:1.5fr 1fr;gap:18px}
@media (max-width:900px){.studio{grid-template-columns:1fr}}
.studio-main{position:relative;overflow:hidden;border-radius:26px;padding:24px;background:radial-gradient(600px 300px at 80% -10%,var(--bandc),transparent 70%),var(--card);border:1px solid var(--line);transition:background .6s}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--line)}
.seg button{border:0;background:none;padding:8px 16px;border-radius:999px;color:var(--muted);font-weight:500}
.seg button.on{background:#fff;color:#111}
.readout{display:flex;align-items:flex-end;gap:16px;margin:26px 0 8px;flex-wrap:wrap}
.readout .big{font-size:clamp(64px,10vw,96px);font-weight:700;line-height:.9;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.readout .big small{font-size:24px;font-weight:500;color:var(--muted);margin-left:6px;letter-spacing:0}
.band-pill{padding:6px 14px;border-radius:999px;font-weight:600;background:var(--bandc);color:#fff;margin-bottom:10px}
.bandbar{display:flex;height:10px;border-radius:999px;overflow:hidden;margin:16px 0 4px;position:relative}
.bandbar div{height:100%;opacity:.35;transition:opacity .3s}
.bandbar div.on{opacity:1}
.bandmarker{position:absolute;top:-5px;width:4px;height:20px;border-radius:2px;background:#fff;box-shadow:0 0 10px #fff;transition:left .15s}
.bandlabels{display:flex;font-size:11px;color:var(--muted)}
.ctrl{margin:20px 0}
.ctrl .row{justify-content:space-between}
.ctrl label{font-weight:600}
.ctrl output{font-variant-numeric:tabular-nums;color:var(--muted)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;padding:0;border:0;border-radius:999px;background:rgba(255,255,255,.12);margin-top:10px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.4),0 0 0 4px rgba(139,123,255,.35);cursor:pointer}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:0;box-shadow:0 0 0 4px rgba(139,123,255,.35)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:rgba(255,255,255,.05);padding:7px 13px;border-radius:999px;font-size:13.5px;white-space:nowrap}
.chip:hover{background:rgba(255,255,255,.12)}
.chip.on{background:#fff;color:#111;border-color:#fff}
.ears{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center;margin:16px 0}
.ear{padding:14px 8px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.ear b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.brain{grid-column:1/-1;padding:14px;border-radius:16px;background:linear-gradient(90deg,rgba(139,123,255,.25),rgba(79,209,197,.2));border:1px solid var(--line2)}
.brain b{font-size:26px}

/* People */
.person{border-radius:var(--r);background:var(--card);border:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:10px}
.avatar{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:20px;color:#fff;flex:none;background:linear-gradient(140deg,var(--g0),var(--g1));box-shadow:0 8px 20px -8px var(--g0)}
.person h3{font-size:18px}

/* Journal */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px}
.kpi{border-radius:var(--r);padding:18px;background:var(--card);border:1px solid var(--line)}
.kpi b{display:block;font-size:32px;font-weight:700;letter-spacing:-.02em}
.kpi span{color:var(--muted);font-size:13px}
.entry{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:start;padding:14px 16px;border-radius:16px;background:var(--card);border:1px solid var(--line);margin-bottom:10px}
.entry .dot{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:20px;background:linear-gradient(140deg,var(--g0),var(--g1))}
.entry h4{margin:0;font-size:16px}
.entry .meta{color:var(--muted);font-size:13px}
.entry .note{margin-top:6px;font-size:14px;white-space:pre-wrap}
.stars-static{color:#ffd36e;letter-spacing:2px}
.daygroup{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-weight:600;margin:18px 0 8px}

/* Learn */
.learn-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.bandrow{display:grid;grid-template-columns:90px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.bandrow:last-child{border:0}
.bandrow b{display:block}
.swatch{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.solf{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.solf div{padding:10px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.solf b{display:block;font-size:18px}
.notice{font-size:13px;color:var(--muted);border-left:3px solid var(--warn);padding:10px 14px;border-radius:8px;background:rgba(255,179,122,.06)}

/* Mini player */
.mini{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:30;width:min(640px,calc(100vw - 24px));border-radius:22px;padding:10px 12px 10px 10px;display:flex;align-items:center;gap:12px;
  box-shadow:0 20px 50px -10px rgba(0,0,0,.6);cursor:pointer;animation:fadeUp .3s ease}
.mini .art{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:linear-gradient(140deg,var(--g0),var(--g1));flex:none;animation:breathe 6s ease-in-out infinite}
.mini .txt{flex:1;min-width:0}
.mini .txt b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .txt span{font-size:13px;color:var(--muted)}
.mini .prog{position:absolute;left:18px;right:18px;bottom:4px;height:3px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden}
.mini .prog i{display:block;height:100%;background:linear-gradient(90deg,var(--g0),#fff);width:0}
.round{width:44px;height:44px;border-radius:50%;border:0;background:#fff;color:#111;display:grid;place-items:center;flex:none}

/* Stage */
.stage{position:fixed;inset:0;z-index:50;background:#06070b;overflow:hidden;animation:stageIn .45s cubic-bezier(.2,.8,.2,1)}
@keyframes stageIn{from{transform:translateY(24px) scale(1.02)}to{transform:none}}
#stCanvas{position:absolute;inset:0;width:100%;height:100%}
.st-top{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:12px;padding:max(16px,env(safe-area-inset-top)) 18px 0}
.st-title{flex:1;text-align:center}
.st-cat{font-size:12px;text-transform:uppercase;letter-spacing:.16em;color:rgba(255,255,255,.65);font-weight:600}
.st-name{font-size:20px;font-weight:600}
.st-for{font-size:13px;color:rgba(255,255,255,.65)}
.st-center{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;width:90%}
.st-hz{font-size:clamp(48px,9vw,80px);font-weight:700;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 4px 30px rgba(0,0,0,.4)}
.st-hz small{font-size:.32em;font-weight:500;margin-left:4px;opacity:.75;letter-spacing:0}
.st-mode{margin-top:8px;font-size:13px;color:rgba(255,255,255,.75)}
.st-breath{min-height:26px;font-size:17px;font-weight:500;margin-bottom:6px;color:#fff;letter-spacing:.04em;transition:opacity .4s}
.st-bottom{position:absolute;left:0;right:0;bottom:0;padding:0 18px max(20px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:14px}
.st-setup{display:flex;gap:10px;padding:12px;border-radius:20px;width:min(560px,100%)}
.st-setup label{flex:1;display:flex;flex-direction:column;gap:4px;font-size:12px;color:rgba(255,255,255,.7)}
.st-setup select,.st-setup input{background:rgba(255,255,255,.08)}
.st-info{display:flex;gap:16px;font-size:14px;color:rgba(255,255,255,.78);font-variant-numeric:tabular-nums;text-align:center;flex-wrap:wrap;justify-content:center}
.st-controls{display:flex;align-items:center;gap:22px}
.play-btn{width:84px;height:84px;border-radius:50%;border:0;background:#fff;color:#111;display:grid;place-items:center;box-shadow:0 0 0 8px rgba(255,255,255,.08),0 20px 50px -10px rgba(0,0,0,.6);transition:transform .15s}
.play-btn:hover{transform:scale(1.05)}
.play-btn:active{transform:scale(.96)}
.st-chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.st-chips .chip{background:rgba(20,22,34,.5);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.sheet{position:absolute;left:50%;bottom:0;transform:translate(-50%,105%);width:min(560px,100%);max-height:70vh;overflow:auto;border-radius:26px 26px 0 0;padding:10px 20px max(24px,env(safe-area-inset-bottom));transition:transform .35s cubic-bezier(.2,.8,.2,1);z-index:3;background:rgba(16,18,28,.88)}
.sheet.open{transform:translate(-50%,0)}
.sheet-grip{width:44px;height:5px;border-radius:3px;background:rgba(255,255,255,.25);margin:4px auto 14px}
.sheet h3{font-size:18px;margin-bottom:12px}
.mixrow{display:grid;grid-template-columns:34px 1fr 46px;align-items:center;gap:10px;margin:10px 0}
.mixrow .ic{font-size:22px;text-align:center}
.mixrow label{font-size:14px;font-weight:500}
.mixrow input{margin-top:6px}
.mixrow output{font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.opt{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.03);margin-bottom:8px}
.opt.on{border-color:#fff;background:rgba(255,255,255,.1)}
.opt small{color:var(--muted)}
.steplist .opt.cur{border-color:var(--accent);background:rgba(139,123,255,.15)}
.steplist .opt.done{opacity:.5}
.done-card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(440px,calc(100% - 32px));border-radius:28px;padding:28px;text-align:center;z-index:4;background:rgba(16,18,28,.85);animation:fadeUp .4s ease}

<script>
"use strict";
/* ============ Helpers ============ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const fmt = s => { if (!isFinite(s)) return '∞'; s = Math.max(0, Math.round(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0'); };
const fmtMin = s => Math.round(s / 60) + ' min';
const fmtHz = hz => (+hz).toLocaleString('nl-NL', { maximumFractionDigits: 2 });
const hexA = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; };
const dayKey = d => { d = new Date(d); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const ICON = {

};
const icon = (name, size) => ICON[name].replace(/width="30" height="30"/, `width="${size}" height="${size}"`);
let toastT; function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600); }

/* ============ Categorieën & programma's ============ */
const CATS = {

};
const cat = name => CATS[name] || CATS.Eigen;
const S = (hz, min, mode = 'auto', label = '', carrier = null) => ({ hz, sec: Math.round(min * 60), mode, label, carrier });
const BUILTIN = [
  { id:'b-sleep', name:'Inslapen', cat:'Slapen', breath:'478', desc:'Je hersengolven zakken langzaam van theta naar diepe delta. Zet het volume laag en laat je meevoeren.',
    steps:[S(6,5,'binaural','Theta'),S(4,5,'binaural','Theta/delta'),S(2.5,10,'binaural','Delta'),S(1.5,10,'binaural','Diepe delta')] },
  { id:'b-deepsleep', name:'Diepe nachtrust', cat:'Slapen', desc:'45 minuten delta op een warme, lage draaggolf, voor een diepe en ongestoorde slaap.',
    steps:[S(3,10,'binaural','Delta',150),S(2,15,'binaural','Delta',150),S(1,20,'binaural','Diepe delta',150)] },
  { id:'b-nap', name:'Powernap', cat:'Slapen', desc:'20 minuten wegzakken in theta, met aan het eind een zachte terugkeer naar alfa en bèta.',
    steps:[S(8,3,'binaural','Inloop'),S(5,12,'binaural','Theta'),S(10,3,'binaural','Ontwaken'),S(14,2,'binaural','Fris')] },
  { id:'b-relax', name:'Diepe ontspanning', cat:'Ontspannen', breath:'calm', desc:'Binaurale beats die geleidelijk zakken van alfa via theta. Ideaal na een drukke dag.',
    steps:[S(10,5,'binaural','Alfa'),S(8,5,'binaural','Alfa/theta'),S(6,8,'binaural','Theta'),S(4,7,'binaural','Theta/delta')] },
  { id:'b-stress', name:'Stress-reset', cat:'Ontspannen', breath:'box', desc:'Tien minuten om terug te komen in je lijf, met box-ademhaling en alfagolven.',
    steps:[S(12,2,'binaural','Landen'),S(10,4,'binaural','Alfa'),S(7.83,4,'binaural','Schumann')] },
  { id:'b-heart', name:'Hartcoherentie', cat:'Ontspannen', breath:'coherent', desc:'639 Hz (verbinding) gecombineerd met een ademritme van 5 in, 5 uit, voor een rustig hartritme.',
    steps:[S(639,10,'tone','Hart')] },
  { id:'b-focus', name:'Focus', cat:'Focus', desc:'Bèta om je te concentreren, met een afsluiting op 40 Hz gamma (isochroon).',
    steps:[S(14,15,'binaural','Bèta'),S(40,5,'isochronic','Gamma')] },
  { id:'b-deepwork', name:'Diep werk', cat:'Focus', desc:'45 minuten ononderbroken concentratie met een korte, rustige afbouw aan het eind.',
    steps:[S(12,5,'binaural','Opstarten'),S(15,20,'binaural','Bèta'),S(16,15,'binaural','Bèta'),S(10,5,'binaural','Afbouw')] },
  { id:'b-study', name:'Studeren', cat:'Focus', desc:'Ontspannen alertheid waarin je makkelijk nieuwe dingen opneemt.',
    steps:[S(10,5,'binaural','Alfa'),S(12,10,'binaural','Alfa/bèta'),S(14,10,'binaural','Bèta')] },

  { id:'b-flow', name:'Creatieve flow', cat:'Meditatie', desc:'Op de grens van alfa en theta, waar ideeën vrij beginnen te stromen.',

    steps:[S(6,5,'binaural','Theta'),S(5,10,'binaural','Diepe theta'),S(4.5,15,'binaural','Trance')] },
  { id:'b-morning', name:'Ochtendboost', cat:'Energie', breath:'box', desc:'Van alfa naar bèta: zo start je je dag helder en energiek.',

  { id:'b-gamma', name:'Gamma-helderheid', cat:'Energie', desc:'40 Hz isochrone pulsen voor een helder en wakker gevoel.', steps:[S(40,10,'isochronic','Gamma')] },

    steps:[S(126.22,5,'tone','Zon'),S(136.10,5,'tone','Aarde / Om'),S(210.42,5,'tone','Maan')] },
  { id:'b-chakra', name:'Chakra-balans', cat:'Chakra', desc:'Van het wortelchakra naar het kruinchakra, elk met de bijbehorende solfeggio-toon.',
    steps:[S(396,3,'tone','Wortel'),S(417,3,'tone','Sacraal'),S(528,3,'tone','Zonnevlecht'),S(639,3,'tone','Hart'),S(741,3,'tone','Keel'),S(852,3,'tone','Derde oog'),S(963,3,'tone','Kruin')] },
  { id:'b-heartchakra', name:'Hartchakra openen', cat:'Chakra', breath:'coherent', desc:'639 Hz met een zachte alfabeat op dezelfde draaggolf.',
    steps:[S(639,6,'tone','Hart'),S(10,6,'binaural','Alfa op 639',639),S(639,6,'tone','Hart')] },
  { id:'b-solfeggio', name:'Solfeggio-reis', cat:'Solfeggio', desc:'Alle negen solfeggio-frequenties na elkaar, van laag naar hoog.',

  { id:'b-528', name:'528 Hz Harmonie', cat:'Solfeggio', desc:'Eén lange sessie op 528 Hz, ook wel de "liefdesfrequentie" genoemd.', steps:[S(528,15,'tone','Harmonie')] },
  { id:'b-396', name:'396 Hz Loslaten', cat:'Solfeggio', desc:'Traditioneel gekoppeld aan het loslaten van angst en schuld.', steps:[S(396,12,'tone','Loslaten')] },
  { id:'b-963', name:'963 Hz Kruin', cat:'Solfeggio', desc:'De hoogste solfeggio-toon, gekoppeld aan eenheid en verbinding met het grotere geheel.', steps:[S(963,12,'tone','Eenheid')] },

/* ============ Opslag ============ */
const KEY = 'freqheal.v1';
const DEF_SETTINGS = { volume:60, toneLevel:.8, wave:'sine', fade:2, carrier:200, endMode:'once', breath:'off', bgPlay:'auto' };
let db;
function load(){
  let d = null; try { d = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  d = d && typeof d === 'object' ? d : {};
  ['programs','people','sessions','favs'].forEach(k => d[k] = Array.isArray(d[k]) ? d[k] : []);
  d.ambient = d.ambient && typeof d.ambient === 'object' ? d.ambient : {};
  d.settings = Object.assign({}, DEF_SETTINGS, d.settings || {});
  db = d;
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) { toast('Opslaan mislukt: ' + e.message); } }
load();

const allPrograms = () => [...BUILTIN, ...db.programs];
const getProgram = id => id === 'studio' ? studioProgram() : allPrograms().find(p => p.id === id);
const totalSec = p => p.steps.reduce((a, s) => a + s.sec, 0);
const resolveMode = s => s.mode === 'auto' ? (s.hz < 20 ? 'binaural' : 'tone') : s.mode;
const MODE_LABEL = { tone:'Pure toon', binaural:'Binaurale beat', isochronic:'Isochrone pulsen' };
const carrierOf = s => +s.carrier || +db.settings.carrier || 200;

/* ============ Audio: stemmen ============ */
function softSquare(ctx){ return ctx.createPeriodicWave(new Float32Array(8), new Float32Array([0,1,0,1/3,0,1/5,0,1/7])); }
function buildVoice(ctx, dest, step, t){
  const mode = resolveMode(step), carrier = carrierOf(step), wave = db.settings.wave;
  const out = ctx.createGain(); out.gain.value = 0; out.connect(dest);
  const nodes = []; let set;
  const osc = (type, f) => { const o = ctx.createOscillator(); o.type = type; o.frequency.value = f; nodes.push(o); return o; };
  const glide = (p, v) => p.setTargetAtTime(v, ctx.currentTime, 0.06);
  if (mode === 'tone'){
    const o = osc(wave, step.hz), g = ctx.createGain(); g.gain.value = wave === 'sine' ? 0.9 : 0.3;
    o.connect(g).connect(out); set = hz => glide(o.frequency, hz);
  } else if (mode === 'binaural'){
    const m = ctx.createChannelMerger(2), g = ctx.createGain(); g.gain.value = 0.8;
    const L = osc('sine', carrier - step.hz / 2), R = osc('sine', carrier + step.hz / 2);
    L.connect(m, 0, 0); R.connect(m, 0, 1); m.connect(g).connect(out);
    set = (hz, c) => { glide(L.frequency, c - hz / 2); glide(R.frequency, c + hz / 2); };
  } else {
    const o = osc('sine', carrier), amp = ctx.createGain(); amp.gain.value = 0.5;
    const lfo = ctx.createOscillator(); lfo.setPeriodicWave(softSquare(ctx)); lfo.frequency.value = step.hz; nodes.push(lfo);

}

/* ============ WAV-export ============ */
async function exportWav(p){
  if (!p) return; const total = totalSec(p);
  if (total > 3600){ alert('WAV-export kan tot 60 minuten. Kort het programma in of maak een kopie met minder stappen.'); return; }
  const amb = Object.entries(db.ambient).filter(([, v]) => v > 0);
  if (!confirm(`"${p.name}" (${fmt(total)}) exporteren als WAV-bestand?${amb.length ? '\nJe huidige geluidslagen worden meegemixt.' : ''}\nHet bestand wordt ongeveer ${Math.round(total * 32000 * 4 / 1048576)} MB.`)) return;
  toast('WAV wordt gemaakt…');
  await new Promise(r => setTimeout(r, 50));

    const sr = 32000, oc = new OfflineAudioContext(2, Math.ceil(sr * (total + .5)), sr);
    const master = oc.createGain(); master.gain.value = (db.settings.volume / 100) ** 2 * 1.1; master.connect(oc.destination);
    const tb = oc.createGain(); tb.gain.value = db.settings.toneLevel; tb.connect(master);
    const ab = oc.createGain(); ab.connect(master);
    const f = Math.max(.05, +db.settings.fade || 0); let t = 0;
    p.steps.forEach((s, i) => {
      const v = buildVoice(oc, tb, s, t), end = t + s.sec, last = i === p.steps.length - 1, gg = v.out.gain;
      gg.setValueAtTime(0, t); gg.linearRampToValueAtTime(1, t + (i ? f : 2));
      if (last){ gg.setValueAtTime(1, Math.max(t + f, end - 3)); gg.linearRampToValueAtTime(0, end); v.nodes.forEach(n => n.stop(end + .05)); }
      else { gg.setValueAtTime(1, end); gg.linearRampToValueAtTime(0, end + f); v.nodes.forEach(n => n.stop(end + f + .05)); }
      t = end;
    });
    amb.forEach(([k, v]) => buildLayer(oc, ab, k, v, 0).stop(total + .5));
    ab.gain.setValueAtTime(1, Math.max(0, total - 3)); ab.gain.linearRampToValueAtTime(0, total);
    const buf = await oc.startRendering();
    const blob = encodeWav(buf), a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = p.name.replace(/[^\w\- ]+/g, '').trim() + '.wav'; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000); toast('⬇ WAV klaar');
  } catch (e){ alert('Export mislukt: ' + e.message); }
}
function encodeWav(buf){

  ws(36, 'data'); dv.setUint32(40, n * ch * 2, true);

      </div>
      <div class="panel" style="grid-column:1/-1"><h3 style="margin-bottom:12px">Solfeggio-frequenties</h3>
        <div class="solf">${SOLF.map(s => `<div><b>${s.hz} Hz</b><span class="small muted">${s.n}</span></div>`).join('')}</div>
        <p class="small muted" style="margin:12px 0 0">Deze betekenissen komen uit spirituele en energetische tradities. Ze zijn niet wetenschappelijk vastgesteld.</p></div>
      <div class="panel"><h3 style="margin-bottom:8px">Tips voor een goede sessie</h3>
        <div class="small" style="display:grid;gap:8px">
          <div>🎧 Gebruik een koptelefoon voor binaurale beats.</div>
          <div>🔉 Laag volume is genoeg: het effect zit niet in de luidheid.</div>
          <div>🛋️ Zit of lig comfortabel, met je ogen dicht.</div>
          <div>⏱ 15–30 minuten is ideaal. Voor slapen of meditatie mag het tot 60 minuten.</div>
          <div>🫁 Combineer de sessie met de ademgids voor een dieper effect.</div>
          <div>📓 Noteer na afloop hoe je je voelt. Zo ontdek je wat bij jou werkt.</div>
        </div></div>
      <div class="panel"><h3 style="margin-bottom:8px">Sessies voor anderen</h3>
        <p class="small">Voeg iemand toe bij <b>Mensen</b>, start een sessie met hun naam en intentie, en houd alles bij in het logboek. Je kunt een sessie ook als WAV exporteren en sturen, zodat de ander zelf kan luisteren.</p>
        <div class="notice">FreqHeal is bedoeld voor ontspanning en welzijn. Het vervangt geen medisch advies of medische behandeling. Luister niet tijdens het autorijden. Heb je epilepsie, dan kun je beter eerst met je arts overleggen.</div></div>
    </div>`;
}

/* ============ Editor ============ */
let editing = null;
function stepRow(s){
  return `<tr><td><input type="number" step="any" min="0.1" max="20000" class="sHz" value="${s.hz}" required style="width:88px"></td>
    <td><input type="number" step="any" min="0.1" class="sMin" value="${+(s.sec / 60).toFixed(2)}" required style="width:70px"></td>
    <td><select class="sMode" style="width:auto">${['auto','tone','binaural','isochronic'].map(m => `<option value="${m}" ${s.mode === m ? 'selected' : ''}>${m === 'auto' ? 'Auto' : MODE_LABEL[m]}</option>`).join('')}</select></td>
    <td><input type="number" step="any" min="20" class="sCar" value="${s.carrier ?? ''}" placeholder="${db.settings.carrier}" style="width:84px"></td>
    <td><input class="sLabel" value="${esc(s.label || '')}" style="min-width:100px"></td>
    <td style="white-space:nowrap"><button type="button" class="tiny" data-m="up">↑</button> <button type="button" class="tiny" data-m="down">↓</button> <button type="button" class="tiny" data-m="x">✕</button></td></tr>`;
}
function openEditor(p){
  editing = p; $('#progDlgTitle').textContent = p.id ? 'Programma bewerken' : 'Nieuw programma';
  const cats = Object.keys(CATS); if (p.cat && !CATS[p.cat]) cats.push(p.cat);
  $('#pCat').innerHTML = cats.map(c => `<option value="${esc(c)}">${CATS[c]?.icon || '•'} ${esc(c)}</option>`).join('');
  $('#pName').value = p.name; $('#pCat').value = p.cat || 'Eigen'; $('#pDesc').value = p.desc || '';
  $('#pSteps').innerHTML = p.steps.map(stepRow).join(''); $('#progDlg').showModal();
}
$('#pAddStep').onclick = () => $('#pSteps').insertAdjacentHTML('beforeend', stepRow(S(432,5,'auto')));
$('#pSteps').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; const tr = b.closest('tr');
  if (b.dataset.m === 'x' && $('#pSteps').children.length > 1) tr.remove();
  if (b.dataset.m === 'up' && tr.previousElementSibling) tr.parentNode.insertBefore(tr, tr.previousElementSibling);
  if (b.dataset.m === 'down' && tr.nextElementSibling) tr.parentNode.insertBefore(tr.nextElementSibling, tr); });
$('#pCancel').onclick = () => $('#progDlg').close();
$('#progForm').onsubmit = e => {
  const steps = [...$('#pSteps').children].map(tr => ({ hz: +tr.querySelector('.sHz').value, sec: Math.round(+tr.querySelector('.sMin').value * 60),
    mode: tr.querySelector('.sMode').value, carrier: tr.querySelector('.sCar').value ? +tr.querySelector('.sCar').value : null, label: tr.querySelector('.sLabel').value.trim() }))
    .filter(s => s.hz > 0 && s.sec > 0);
  if (!steps.length){ e.preventDefault(); alert('Voeg minstens één geldige stap toe.'); return; }
  const p = { id: editing.id || 'u-' + uid(), name: $('#pName').value.trim(), cat: $('#pCat').value, desc: $('#pDesc').value.trim(), steps };
  const i = db.programs.findIndex(x => x.id === p.id); if (i >= 0) db.programs[i] = p; else db.programs.push(p);
  save(); toast('Programma opgeslagen'); if ($('#discover').classList.contains('active')) renderDiscover(); else { filterCat = ''; showTab('discover'); }
};

/* ============ Instellingen ============ */
$('#settingsBtn').onclick = () => { $('#setBg').value = db.settings.bgPlay;
  $('#bgStatus').textContent = bg.available() ? '✓ Beschikbaar. De sessie wordt afgespeeld als audiobestand en speelt door op je vergrendelscherm. De Studio blijft live.'
    : 'Werkt alleen als je FreqHeal via internet opent (bijv. GitHub Pages), niet als lokaal bestand.' + (location.protocol === 'file:' ? '' : ' Herlaad de pagina één keer.');
  $('#setWave').value = db.settings.wave; $('#setFade').value = db.settings.fade; $('#setCarrier').value = db.settings.carrier; $('#setDlg').showModal(); };
$('#setClose').onclick = () => $('#setDlg').close();
$('#setBg').onchange = e => { db.settings.bgPlay = e.target.value; save(); };
$('#setWave').onchange = e => { db.settings.wave = e.target.value; save(); };
$('#setFade').onchange = e => { db.settings.fade = clamp(+e.target.value || 0, 0, 10); save(); };
$('#setCarrier').onchange = e => { db.settings.carrier = clamp(+e.target.value || 200, 40, 1000); save(); };
$('#exportBtn').onclick = () => { const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(db, null, 2)], { type:'application/json' }));
  a.download = 'freqheal-backup-' + dayKey(new Date()) + '.json'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); };
$('#importFile').onchange = async e => { const f = e.target.files[0]; if (!f) return;
  try { const d = JSON.parse(await f.text()); if (!d || !Array.isArray(d.programs) || !Array.isArray(d.sessions)) throw new Error('Onbekend formaat');
    if (!confirm('Je huidige gegevens vervangen door deze back-up?')) return;
    localStorage.setItem(KEY, JSON.stringify(d)); load(); render(currentTab); toast('Back-up geïmporteerd'); }
  catch (err){ alert('Import mislukt: ' + err.message); } e.target.value = ''; };

/* ============ Navigatie ============ */
let currentTab = 'discover';
function render(t){ ({ discover: renderDiscover, studio: renderStudio, people: renderPeople, journal: renderJournal, learn: renderLearn })[t](); }
function showTab(t){ currentTab = t; $$('#nav button').forEach(b => b.classList.toggle('active', b.dataset.tab === t));
  $$('main section').forEach(s => s.classList.toggle('active', s.id === t)); render(t); }
$('#nav').addEventListener('click', e => { const b = e.target.closest('button'); if (b) showTab(b.dataset.tab); });
document.addEventListener('keydown', e => {
  if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName) || $('dialog[open]')) return;
  if (e.code === 'Space' && (stageOpen || pl.playing)){ e.preventDefault(); if (e.repeat) return; document.activeElement?.blur?.(); togglePlay(); }
  if (e.key === 'Escape' && stageOpen){ sheetKind ? closeSheet() : hideStage(); }
  if (stageOpen && e.key === 'ArrowRight') jump(1);
  if (stageOpen && e.key === 'ArrowLeft') jump(-1);
});

render('discover');
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(e => console.warn('SW', e));
</script>
</body>
</html>
